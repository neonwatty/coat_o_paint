<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="styles.css" rel="stylesheet">
    <style>
      .toggle-checkbox:checked {
        right: 0;
        border-color: #68d391;
      }

      .toggle-checkbox:checked + .toggle-label {
        background: #68d391;
      }
    </style>
    <title>Main Page</title>
  </head>
  <body class="bg-white dark:bg-slate-800"">
    <script src="src/js/partials.js"></script>
    <script src="src/js/hamburger_dropdown.js"></script>
    <script src="src/js/utilities.js"></script>

    <!-- navbar placeholder -->
    <div id="nav-placeholder"></div>

    <!-- partial placeholder -->
    <div id="partial-placeholder"></div>
    <script>
      loadHTML("src/partials/nav.html", "nav-placeholder");
    </script>
    <script>
        setTimeout(() => {
        const toggleCheckbox = document.getElementById('toggle');
        if (toggleCheckbox) {
          toggleCheckbox.addEventListener('change', function () {
            document.documentElement.classList.toggle('dark', this.checked);
          });
        }
      },500)  
      document.addEventListener("DOMContentLoaded", () => {
          // retrieve index on first load
          loadHTML('src/partials/index.html', 'partial-placeholder'); 
          setTimeout(() => {
              // get menu elements
              const isMobile = /Mobi|Android/i.test(navigator.userAgent); // Simple check for mobile devices
              if (isMobile) {
                  setActive('home-v');
              }else {
                setActive('home-h')
              }
          },100)
      });
    </script>
  </body>
</html>
