<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./dist/styles.css" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class'
      }
    </script>
    <style>
      .toggle-checkbox:checked {
        right: 0;
        border-color: #68d391;
      }

      .toggle-checkbox:checked + .toggle-label {
        background: #68d391;
      }
    </style>
    <title>Main Page</title>
  </head>
  <body class="bg-white dark:bg-slate-800"">
    <!-- navbar placeholder -->
    <div id="nav-placeholder"></div>

    <!-- partial placeholder -->
    <div id="partial-placeholder"></div>


    <div id="newsletter-signup-placeholder"></div>
    <script src="src/js/partials.js"></script>
    <script>
      loadHTML("src/partials/nav.html", "nav-placeholder");
    </script>
    <script src="src/js/hamburger_dropdown.js"></script>
    <script src="src/js/profile_dropdown.js"></script>
    <script src="src/js/nav_buttons.js"></script>
    <script>
        setTimeout(() => {
        const toggleCheckbox = document.getElementById('toggle');
        if (toggleCheckbox) {
          toggleCheckbox.addEventListener('change', function () {
            document.documentElement.classList.toggle('dark', this.checked);
          });
        }
      },500)  
    </script>
  </body>
</html>
